<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#030610" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Forge</title>
    <!-- The default command-center palette, painted before any script runs, so the first frame is
         already navy-black and blue rather than tokens.css's neutral dark and green. It is the default preset's dark half
         verbatim (`COMMAND_CENTER_DARK`, pinned by tests/index-html-palette.test.ts); a preset chosen in
         Settings is installed later in <head> and wins on order. -->
    <style>
      html.dark:root {
        --primary: #1b92ff;
        --primary-foreground: #03101f;
        --secondary: #111830;
        --secondary-foreground: #e6eaf6;
        --destructive: #ff8a8a;
        --destructive-foreground: #1f0606;
        --success: #4ade9d;
        --success-foreground: #03140c;
        --warning: #fbbf24;
        --warning-foreground: #1a1204;
        --info: #6cb8ff;
        --info-foreground: #03101f;
        --background: #030610;
        --foreground: #e6eaf6;
        --border: #1d2331;
        --input: #293249;
        --ring: #1b92ff;
        --muted: #080d1a;
        --muted-foreground: #8f9bb6;
        --accent: #111830;
        --accent-foreground: #e6eaf6;
        --card: #0b1020;
        --card-foreground: #e6eaf6;
        --popover: #0e1428;
        --popover-foreground: #e6eaf6;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
