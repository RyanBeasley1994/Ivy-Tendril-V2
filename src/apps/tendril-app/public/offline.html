<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e13" />
    <title>Forge · offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0e13; color: #e6edf3; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
             padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0; max-width: 28em; color: #8593a1; }
      button { margin-top: 6px; height: 44px; padding: 0 22px; border: 0; border-radius: 22px; background: #00cc92; color: #04140f; font: 600 15px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Forge can't reach your server right now. Your managers keep working there; this page comes back as soon as you have a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
